Port 22222
# IPv4 only: the firewall allows admin SSH only from your IPv4 addresses anyway.
AddressFamily inet
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# logpull is the restricted account the dashboard uses to fetch logs (README, Dashboard setup).
AllowUsers <admin-user> logpull
AllowTcpForwarding no
AllowAgentForwarding no
X11Forwarding no
